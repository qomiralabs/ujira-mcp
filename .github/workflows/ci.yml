name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs for pushes to
# development, staging and main are never cancelled, so every merged commit
# keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every tool is a pinned release binary checked against its SHA256 before it
# runs.
env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # gitleaks is MIT licensed. Bump the version and its hash together, and
  # only to a release at least 14 days old.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # squawk is Apache-2.0 licensed. Bump the version and its hash together, and
  # only to a release at least 14 days old. The hash is the one GitHub lists for
  # the release asset.
  SQUAWK_VERSION: 2.72.0
  SQUAWK_SHA256: a61661808119a82515565503111099b070c869f73698f61cb1785de5d0c8b11a
  # The Unicode tables of the runner's python3 decide what the invisible character
  # check rejects. A runner update that moves them fails the check, so the set of
  # rejected characters only changes when this does.
  INVISIBLE_UNICODE_VERSION: 15.0.0
  # The server and the console are checked on the Node line the image runs
  # (node:22-slim), at an exact release so a new one cannot change a result.
  NODE_VERSION: 22.23.5

jobs:
  # Repository checks that need no tools beyond the runner's shell.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The template every pull request starts from must keep asking for the
      # linked issue, tests, docs, the checklist and the required reviews.
      - name: Check the pull request template
        run: |
          scripts/check-pr-template.sh
          scripts/check-pr-template.test.sh

      # Every tool download must retry a passing failure, have a time limit and be
      # followed by its checksum check.
      - name: Check the tool downloads
        run: |
          scripts/check-workflow-downloads.sh
          scripts/check-workflow-downloads.test.sh

  # Scans the whole history, not only the change, so it checks out every
  # commit. A key that was committed and later deleted, or added in a merge
  # resolution, still fails.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint workflows
        run: |
          tarball="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 180 -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" actionlint
          rm "$tarball"
          "${RUNNER_TEMP}/actionlint" -color

      - name: Install gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tarball="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 180 -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm "$tarball"
          version=$("${RUNNER_TEMP}/gitleaks/gitleaks" version)
          [ "$version" = "${GITLEAKS_VERSION}" ] || { echo "gitleaks is $version, not ${GITLEAKS_VERSION}" >&2; exit 1; }
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"

      # On pull requests the rules come from the base branch, so a change
      # cannot loosen the rules its own scan runs with. Empty on pushes.
      - name: Scan the full history for secrets
        env:
          SECRET_SCAN_BASE_REF: ${{ github.base_ref }}
        run: scripts/secret-scan.sh

      # Plants generated fake keys in throwaway repos and checks the scan
      # fails on each, so a config change cannot quietly stop detection.
      - name: Test the secret scan
        if: ${{ !cancelled() }}
        run: scripts/secret-scan.test.sh

  # Fails on any em dash or en dash in a tracked file's content or its path.
  # The same scripts run in every UJIRA repository. The self test runs first,
  # so the check's result is only trusted once the check is known to fail when
  # it should, and the second step reports even when the first fails.
  dashes:
    name: dashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the dash check
        run: scripts/test-check-dashes.sh

      - name: Check for dashes
        if: ${{ !cancelled() }}
        run: scripts/check-dashes.sh

  # Literal bidirectional controls and invisible characters can make code read
  # differently from how it runs, in a file, a file name or a symlink target. Reads
  # committed blobs, with the runner's python3 and its standard library only, and
  # fails if its Unicode version is not the pinned one. The second step reports even
  # when the first fails.
  invisible-characters:
    name: invisible-characters
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check invisible characters
        run: scripts/check-invisible-characters.py --unicode-version "$INVISIBLE_UNICODE_VERSION"

      - name: Test the invisible character check
        if: ${{ !cancelled() }}
        run: scripts/test-check-invisible-characters.sh

  # The up section of every migration, linted by squawk for changes that would
  # block a live table. The self test runs first and the lint reports even when
  # it fails, so a squawk that stopped rejecting the unsafe fixture shows up
  # next to the result it would otherwise make look clean.
  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install squawk
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 180 -o "${RUNNER_TEMP}/squawk" "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          echo "${SQUAWK_SHA256}  ${RUNNER_TEMP}/squawk" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/squawk"
          version=$("${RUNNER_TEMP}/squawk" --version)
          [ "$version" = "squawk ${SQUAWK_VERSION}" ] || { echo "squawk is $version, not ${SQUAWK_VERSION}" >&2; exit 1; }
          echo "SQUAWK=${RUNNER_TEMP}/squawk" >> "$GITHUB_ENV"

      - name: Test the migration lint
        run: scripts/lint-migrations.test.sh

      - name: Lint the migrations
        if: ${{ !cancelled() }}
        run: scripts/lint-migrations.sh

  # The MCP server, the payout engine and the console API. The install is the
  # lockfile exactly, with no install scripts, the same way the image builds.
  # Every step after the install reports even when an earlier one fails, so one
  # run shows every problem.
  server:
    name: server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Test with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # Only what ships in the image. Dev tools never reach production, and
      # their advisories are handled through Dependabot.
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev

  # The image the host runs, built from the Dockerfile and run the way a host
  # runs it: both roles (the default) and the web role alone answer /healthz,
  # the worker role alone opens no port, an unknown role refuses to start, and
  # SIGTERM stops each within 20 s, the web role first. With no database the
  # migration step is skipped; against a Postgres, two instances run the
  # shipped migrations once before their roles start, and a failing migration
  # exits 1 before any role starts. scripts/check-image.sh holds the checks,
  # so they run the same on a laptop.
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag ujira-mcp:ci .

      - name: Run each role
        run: scripts/check-image.sh ujira-mcp:ci

  # The local Postgres in docker-compose.yml: it comes up healthy and takes a
  # password login from the host with the URL the README documents.
  local-db:
    name: local-db
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Postgres
        run: docker compose up --detach --wait db

      - name: Connect with the documented URL
        env:
          UJIRA_DB_MIGRATOR_URL: postgresql://ujira:ujira@127.0.0.1:54329/ujira
        run: |
          version=$(psql "$UJIRA_DB_MIGRATOR_URL" --no-psqlrc --tuples-only --no-align --command 'show server_version')
          echo "server_version $version"
          case "$version" in
            17.*) ;;
            *)
              echo "expected Postgres 17, got $version" >&2
              exit 1
              ;;
          esac

      - name: Stop Postgres
        if: ${{ always() }}
        run: docker compose down --volumes

  # The console web app served at /app. Same rules as the server, plus the
  # production build the image ships and the license allowlist.
  console:
    name: console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
        working-directory: console
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node_modules/.bin/vite build

      - name: Check licenses
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run licenses

      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev

  # The console's browser flows in mock mode, at 375, 768 and 1440 wide in
  # light and dark. They need no server, wallet or network beyond the fonts.
  # The screenshots are kept as an artifact for the pull request, pass or fail.
  console-e2e:
    name: console-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
        working-directory: console
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The browser build is the one the locked Playwright release names.
      - name: Install the browser
        run: timeout 600 node_modules/.bin/playwright install --with-deps chromium

      - name: Build
        run: node_modules/.bin/vite build

      - name: Run the flows
        env:
          CI: 'true'
        run: node_modules/.bin/playwright test

      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-screenshots
          path: console/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14

  # The embed widget served at /embed/v1/ujira-embed.js. Same rules as the
  # console, plus the size budget, which the build itself enforces, and the
  # browser tests against the built file on a plain HTML page, with axe.
  embed:
    name: embed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
        working-directory: embed
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # Builds dist/ujira-embed.js and fails above 60 KB gzipped.
      - name: Build and check the size budget
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Check licenses
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run licenses

      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev

      - name: Install the browser
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: timeout 600 node_modules/.bin/playwright install --with-deps chromium

      - name: Browser tests with axe
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run e2e

      - name: Keep the browser test report
        if: ${{ failure() && steps.browser.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embed-playwright-report
          path: embed/playwright-report
          if-no-files-found: warn
          retention-days: 7
