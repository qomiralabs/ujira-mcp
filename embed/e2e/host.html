<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payout setup</title>
    <!--
      A stand in for an integrator's page: one script tag, one element, no
      framework. The greys are deliberately not UJIRA colours, so a
      screenshot shows what the widget brings and what the page brings.
      The address can set the token, the mode and a page wallet:
        /host.html?token=ujes_test_no-trustline&mode=dark&wallet=1
        /host.html?token=  (no token at all)
    -->
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #1a1a1a;
        background: #f4f4f5;
      }

      body[data-mode='dark'] {
        color: #f4f4f5;
        background: #18181b;
      }

      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 20px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Payout setup</h1>
      <ujira-onboarding id="widget" token="ujes_test_wallet"></ujira-onboarding>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const widget = document.getElementById('widget');
      if (params.has('token')) {
        const token = params.get('token');
        if (token === '') widget.removeAttribute('token');
        else widget.setAttribute('token', token);
      }
      const mode = params.get('mode');
      if (mode !== null) {
        widget.setAttribute('mode', mode);
        document.body.dataset.mode = mode;
      }
      window.completed = [];
      widget.addEventListener('ujira-onboarding-complete', (event) => {
        window.completed.push(event.detail);
      });
      if (params.get('wallet') === '1') {
        widget.wallet = {
          signMessage: () => Promise.resolve({ signature: 'c2lnbmVkIGJ5IHRoZSBwYWdl' }),
        };
      }
    </script>
    <script type="module" src="/embed/v1/ujira-embed.js"></script>
  </body>
</html>
